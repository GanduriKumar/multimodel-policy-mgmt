<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frontend</title>
    <!-- Bootstrap via CDN to keep dependencies lean -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- Inline brand overrides to ensure colors apply even before app CSS loads -->
    <style>
      :root{
        --g-blue:#1a73e8;--g-red:#d93025;--g-yellow:#f9ab00;--g-green:#188038;--g-surface:#f8f9fa;--g-text:#202124;
        --bs-primary: var(--g-blue); --bs-success: var(--g-green); --bs-danger: var(--g-red); --bs-warning: var(--g-yellow);
        --bs-link-color: var(--g-blue); --bs-link-hover-color:#185abc; --bs-body-bg: var(--g-surface); --bs-body-color: var(--g-text);
      }
      .bg-success{background-color:var(--g-green)!important}.bg-danger{background-color:var(--g-red)!important}.bg-primary{background-color:var(--g-blue)!important}
      .btn-primary{background-color:var(--g-blue)!important;border-color:var(--g-blue)!important}
      .btn-success{background-color:var(--g-green)!important;border-color:var(--g-green)!important}
      .btn-danger{background-color:var(--g-red)!important;border-color:var(--g-red)!important}
      .navbar .navbar-brand,.navbar .nav-link.active,.navbar .nav-link:hover{color:var(--g-blue)!important}
      a{color:var(--g-blue)} a:hover{color:#185abc}
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
